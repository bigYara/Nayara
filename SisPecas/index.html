<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Estoque</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>Sistema de Estoque</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="E-mail"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Senha"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="login.js"></script>

</body>
</html>
