<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basf Notes</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #222;
      --primary: #0046ad;
      --secondary: #005ed9;
      --note: #f9f9f9;
    }

    body.dark {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --primary: #005ed9;
      --secondary: #2d7dff;
      --note: #2a2a2a;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--text);
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: var(--secondary);
    }

    .notes {
      margin-top: 20px;
    }

    .note {
      background: var(--note);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      word-break: break-word;
    }

    .delete-btn {
      background: red;
      width: auto;
      padding: 8px 12px;
      font-size: 14px;
    }

    .delete-btn:hover {
      background: darkred;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1 style="margin:0;">📝 Basf Notes</h1>
      <button onclick="toggleTheme()" style="width:auto; padding:10px;">🌙</button>
    </div>

    <div style="text-align:center; margin-bottom:20px;">
      <img src="https://globalfert.com.br/wp-content/uploads/2021/10/basf.png" alt="BASF Logo" style="max-width:220px; width:100%; border-radius:10px;">
    </div>

    <textarea id="noteInput" placeholder="Digite sua anotação..."></textarea>

    <button onclick="addNote()">Salvar Nota</button>

    <div class="notes" id="notesContainer"></div>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem('notes')) || [];

    function saveNotes() {
      localStorage.setItem('notes', JSON.stringify(notes));
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');
      container.innerHTML = '';

      notes.forEach((note, index) => {
        const noteDiv = document.createElement('div');
        noteDiv.classList.add('note');

        noteDiv.innerHTML = `
          <span>${note}</span>
          <div style="display:flex; gap:5px;">
            <button style="background:orange; width:auto; padding:8px 12px; font-size:14px;" onclick="editNote(${index})">Editar</button>
            <button class="delete-btn" onclick="deleteNote(${index})">Excluir</button>
          </div>
        `;

        container.appendChild(noteDiv);
      });
    }

    function addNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();

      if (text === '') {
        alert('Digite alguma nota!');
        return;
      }

      notes.push(text);
      saveNotes();
      function toggleTheme() {
      document.body.classList.toggle('dark');

      if (document.body.classList.contains('dark')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    }

    const savedTheme = localStorage.getItem('theme');

    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
    }

    renderNotes();

      input.value = '';
    }

    function editNote(index) {
      const newText = prompt('Editar nota:', notes[index]);

      if (newText !== null && newText.trim() !== '') {
        notes[index] = newText.trim();
        saveNotes();
        renderNotes();
      }
    }

    function deleteNote(index) {
      notes.splice(index, 1);
      saveNotes();
      renderNotes();
    }

    renderNotes();
  </script>
</body>
</html>
